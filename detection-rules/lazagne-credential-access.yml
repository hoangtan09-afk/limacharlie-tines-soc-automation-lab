DETECT:

events:
  - NEW_PROCESS
  - EXISTING_PROCESS
op: and
rules:
  - op: is windows
  - op: or
    rules:
      - case sensitive: false
        op: ends with
        path: event/FILE_PATH
        value: lazagne.exe
      - case sensitive: false
        op: ends with
        path: event/COMMAND_LINE
        value: all
      - case sensitive: false
        op: contains
        path: event/COMMAND_LINE
        value: lazagne
      - case sensitive: false
        op: is
        path: event/HASH
        value: 3cc5ee93a9ba1fc57389705283b760c8bd61f35e9398bbfa3210e2becf6d4b05


Response:

- action: report
  metadata:
    author: Eric
    description: Detects Lazagne (SOAR-EDR Tool)
    falsepositives:
      - To the moon
    level: medium
    tags:
      - attack.credential_access
  name: Eric - HackTool - Lazagne (SOAR-EDR)




