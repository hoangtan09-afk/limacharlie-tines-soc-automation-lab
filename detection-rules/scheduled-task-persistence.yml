Detect:

event: NEW_PROCESS
op: and
rules:
  - op: is windows
  - op: is tagged
    tag: win11-home
  - case sensitive: false
    op: ends with
    path: event/FILE_PATH
    value: schtasks.exe
  - case sensitive: false
    op: contains
    path: event/COMMAND_LINE
    value: /create


Response:

- action: report
  metadata:
    author: Eric
    description: Detects scheduled task creation on the monitored Windows endpoint
    level: medium
    tags:
      - attack.persistence
      - attack.t1053.005
  name: Eric - Suspicious Scheduled Task Creation
